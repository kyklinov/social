<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Статистика соцсетей</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #F6F6F4;
    --surface: #FFFFFF;
    --border: #E3E2DD;
    --text: #1C1C1A;
    --text-muted: #6B6A63;
    --accent: #2F6F5E;
    --accent-soft: #E4F0EC;
    --warn: #B4552F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    padding: 28px 32px 0;
    max-width: 1180px;
    margin: 0 auto;
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--text-muted);
    font-size: 14px;
    margin: 0 0 20px;
  }
  nav.platforms {
    display: flex;
    gap: 6px;
    border-bottom: 1px solid var(--border);
  }
  nav.platforms button {
    border: none;
    background: none;
    font-size: 14px;
    padding: 10px 16px;
    cursor: pointer;
    color: var(--text-muted);
    border-bottom: 2px solid transparent;
  }
  nav.platforms button.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
    font-weight: 600;
  }
  nav.platforms button:disabled {
    color: #C8C7C0;
    cursor: default;
  }
  main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 24px 32px 60px;
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 20px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
  }
  .card .label {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .card .value {
    font-size: 22px;
    font-weight: 600;
  }
  .card .delta {
    font-size: 12px;
    color: var(--accent);
    margin-top: 4px;
  }
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 20px;
  }
  .panel h2 {
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 14px;
  }
  .grid-2 {
    display: grid;
    grid-template-columns: 1.6fr 1fr;
    gap: 20px;
  }
  .grid-3 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th {
    text-align: left;
    color: var(--text-muted);
    font-weight: 500;
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
  }
  td {
    padding: 8px 8px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  tr:last-child td { border-bottom: none; }
  .post-text {
    max-width: 340px;
  }
  .post-link {
    color: var(--accent);
    text-decoration: none;
    font-size: 12px;
  }
  .bar-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .bar-label { width: 130px; color: var(--text-muted); flex-shrink: 0; }
  .bar-track {
    flex: 1;
    background: var(--accent-soft);
    border-radius: 4px;
    height: 10px;
    overflow: hidden;
  }
  .bar-fill { background: var(--accent); height: 100%; }
  .bar-value { width: 36px; text-align: right; flex-shrink: 0; }
  footer {
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 32px 40px;
    color: var(--text-muted);
    font-size: 12px;
  }
  @media (max-width: 800px) {
    .cards { grid-template-columns: repeat(2, 1fr); }
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>Статистика соцсетей</h1>
  <p class="subtitle">Обновляется автоматически раз в неделю</p>
  <nav class="platforms">
    <button class="active">VK</button>
    <button disabled title="Подключим следующим шагом">YouTube</button>
    <button disabled title="Подключим следующим шагом">Instagram</button>
    <button disabled title="Подключим следующим шагом">Facebook</button>
    <button disabled title="Подключим следующим шагом">Telegram</button>
  </nav>
</header>

<main>

  <div class="cards" id="statCards"></div>

  <div class="grid-2">
    <div class="panel">
      <h2>Динамика подписчиков</h2>
      <canvas id="growthChart" height="90"></canvas>
    </div>
    <div class="panel">
      <h2>Пол аудитории</h2>
      <canvas id="genderChart" height="140"></canvas>
    </div>
  </div>

  <div class="grid-3">
    <div class="panel">
      <h2>Возраст аудитории</h2>
      <div id="ageBars"></div>
    </div>
    <div class="panel">
      <h2>Города</h2>
      <table><thead><tr><th>Город</th><th>%</th></tr></thead><tbody id="citiesTable"></tbody></table>
    </div>
    <div class="panel">
      <h2>Страны</h2>
      <table><thead><tr><th>Страна</th><th>%</th></tr></thead><tbody id="countriesTable"></tbody></table>
    </div>
  </div>

  <div class="panel">
    <h2>Топ публикаций</h2>
    <table>
      <thead><tr><th>Дата</th><th>Текст</th><th>Лайки</th><th>Репосты</th><th>Комменты</th><th>Просмотры</th></tr></thead>
      <tbody id="postsTable"></tbody>
    </table>
  </div>

</main>

<footer id="footerNote"></footer>

<script>
async function loadData() {
  const [history, latest] = await Promise.all([
    fetch('../data/vk/history.json').then(r => r.json()),
    fetch('../data/vk/latest.json').then(r => r.json())
  ]);
  render(history, latest);
}

function fmt(n) {
  return new Intl.NumberFormat('ru-RU').format(n);
}

function render(history, latest) {
  const first = history[0].members_count;
  const last = history[history.length - 1].members_count;
  const growthPct = (((last - first) / first) * 100).toFixed(1);

  const mobileShare = latest.stats.visitors
    ? Math.round((latest.stats.visitors.mobile_views / latest.stats.visitors.views) * 100)
    : null;

  const cards = [
    { label: 'Подписчиков', value: fmt(latest.members_count), delta: `+${growthPct}% за период` },
    { label: 'Охват за неделю', value: fmt(latest.stats.reach.reach), delta: `из них подписчиков: ${fmt(latest.stats.reach.reach_subscribers)}` },
    { label: 'Просмотры за неделю', value: fmt(latest.stats.visitors.views), delta: `${fmt(latest.stats.visitors.visitors)} уникальных посетителей` },
    { label: 'С мобильных', value: mobileShare + '%', delta: 'от общих просмотров' }
  ];
  document.getElementById('statCards').innerHTML = cards.map(c => `
    <div class="card">
      <div class="label">${c.label}</div>
      <div class="value">${c.value}</div>
      <div class="delta">${c.delta}</div>
    </div>
  `).join('');

  new Chart(document.getElementById('growthChart'), {
    type: 'line',
    data: {
      labels: history.map(h => h.date),
      datasets: [{
        data: history.map(h => h.members_count),
        borderColor: '#2F6F5E',
        backgroundColor: 'rgba(47,111,94,0.08)',
        fill: true,
        tension: 0.25,
        pointRadius: 0,
        borderWidth: 2
      }]
    },
    options: {
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { maxTicksLimit: 8 }, grid: { display: false } },
        y: { grid: { color: '#EEEEE9' } }
      }
    }
  });

  const genderMap = { f: 'Женщины', m: 'Мужчины' };
  new Chart(document.getElementById('genderChart'), {
    type: 'doughnut',
    data: {
      labels: latest.stats.sex.map(s => genderMap[s.value] || s.value),
      datasets: [{
        data: latest.stats.sex.map(s => s.count),
        backgroundColor: ['#2F6F5E', '#B4552F'],
        borderWidth: 0
      }]
    },
    options: { plugins: { legend: { position: 'bottom' } } }
  });

  const maxAge = Math.max(...latest.stats.age.map(a => a.count));
  document.getElementById('ageBars').innerHTML = latest.stats.age.map(a => `
    <div class="bar-row">
      <div class="bar-label">${a.value}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(a.count / maxAge) * 100}%"></div></div>
      <div class="bar-value">${a.count}%</div>
    </div>
  `).join('');

  document.getElementById('citiesTable').innerHTML = latest.stats.cities.map(c => `
    <tr><td>${c.name}</td><td>${c.count}%</td></tr>
  `).join('');

  document.getElementById('countriesTable').innerHTML = latest.stats.countries.map(c => `
    <tr><td>${c.name}</td><td>${c.count}%</td></tr>
  `).join('');

  document.getElementById('postsTable').innerHTML = latest.top_posts.map(p => `
    <tr>
      <td>${new Date(p.date).toLocaleDateString('ru-RU')}</td>
      <td class="post-text">${p.text}<br><a class="post-link" href="${p.url}" target="_blank">Открыть →</a></td>
      <td>${fmt(p.likes)}</td>
      <td>${fmt(p.reposts)}</td>
      <td>${fmt(p.comments)}</td>
      <td>${fmt(p.views)}</td>
    </tr>
  `).join('');

  document.getElementById('footerNote').textContent =
    'Данные обновлены: ' + new Date(latest.date).toLocaleDateString('ru-RU');
}

loadData().catch(err => {
  document.querySelector('main').innerHTML =
    '<p style="color:#B4552F">Не удалось загрузить данные: ' + err.message + '</p>';
});
</script>

</body>
</html>
